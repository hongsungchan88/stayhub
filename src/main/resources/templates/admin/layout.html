<!DOCTYPE html>
<!--/*
  관리자 공통 레이아웃 (AdminLTE 3.2.0). 상단바 + 좌측 메뉴 + 본문 + 토스트·삭제 확인 팝업.

  이 화면이 하는 일
    각 화면이 제목과 본문(<section>)을 넘기면 이 틀에 끼워서 그립니다. (Thymeleaf fragment)
    상단 이름·역할과 좌측 메뉴는 AdminPageInterceptor 가 넣은 loginUser·menuGroups 로 그립니다.
    역할이 볼 수 없는 메뉴는 HTML 에 아예 나오지 않습니다(정책정의서 "메뉴 노출").
    토스트는 AdminLTE 가 오른쪽 위에 자리를 만들어 띄웁니다(stayhub.js 의 toast).

  쓰는 법 (내 화면 파일 맨 위)
    <html xmlns:th="http://www.thymeleaf.org"
          th:replace="~{admin/layout :: layout('화면 제목', ~{::section})}">
    <body><section class="content"> ...본문과 <script>... </section></body></html>

  따라 만들 때 바꿀 곳
    없습니다. 복사하지 마세요. 라이브러리 버전을 바꾸려면 정기 회의 안건으로 올립니다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} - stayhub|">stayhub</title>

    <!-- 버전 고정. admin-lte@3.2.0 이 쓰는 jQuery·Bootstrap·Font Awesome 버전과 맞춘 것입니다. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
    <link rel="stylesheet" th:href="@{/css/stayhub.css}">
    <!-- 화면 본문의 <script> 가 바로 쓸 수 있도록 head 에서 먼저 불러옵니다. -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
    <script th:src="@{/js/stayhub.js}"></script>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- 상단바 -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button" aria-label="메뉴 접기"><i class="fas fa-bars"></i></a>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto align-items-center">
            <li class="nav-item mr-3">
                <i class="far fa-user mr-1"></i>
                <span th:text="${loginUser.name}">이름</span>
                <span class="badge badge-secondary ml-1" th:text="${loginUser.role}">HOST</span>
            </li>
            <li class="nav-item">
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="logout()">로그아웃</button>
            </li>
        </ul>
    </nav>

    <!-- 좌측 메뉴 (AdminMenu enum) -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/admin}" class="brand-link">
            <span class="brand-text font-weight-bold ml-3">stayhub</span>
        </a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" role="menu">
                    <th:block th:each="group : ${menuGroups}">
                        <li class="nav-header" th:text="${group.key}">1depth</li>
                        <li class="nav-item" th:each="menu : ${group.value}">
                            <a th:href="@{${menu.url}}" class="nav-link"
                               th:classappend="${menu.isActive(currentUri)} ? 'active'">
                                <i class="nav-icon far fa-circle"></i>
                                <p th:text="${menu.label}">2depth</p>
                            </a>
                        </li>
                    </th:block>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- 본문 -->
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <h1 class="m-0 text-dark" th:text="${title}">화면 제목</h1>
            </div>
        </div>
        <div th:replace="${content}">각 화면의 &lt;section&gt;</div>
    </div>
</div>

<!-- 삭제 확인 팝업 (stayhub.js 의 confirmDelete). 입력 팝업을 만들 때 이 모양을 내 화면에 복사해 씁니다. -->
<div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="confirmModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalTitle">삭제 확인</h5>
            </div>
            <div class="modal-body">삭제하시겠습니까?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal" data-cancel>취소</button>
                <button type="button" class="btn btn-danger" data-confirm>삭제</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
