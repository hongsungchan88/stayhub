<!DOCTYPE html>
<!--/*
  예약 상세 SCR-RSV-02 (/admin/reservations/{id}).
  주소에서 예약 ID를 읽고 GET /api/reservations/{id}로 조회합니다.
  표시하는 값은 textContent로 넣어 HTML로 해석되지 않게 합니다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('예약 상세', ~{::section})}">
<body>
<section class="content">
    <div class="container-fluid">
        <div class="alert alert-danger d-none" id="detailError"
             role="alert"></div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">예약 정보</h2>
            </div>
            <div class="card-body">
                <p class="text-muted mb-0" id="loading">
                    예약 정보를 불러오는 중입니다.
                </p>

                <dl class="row mb-0 d-none" id="details">
                    <dt class="col-sm-3">예약번호</dt>
                    <dd class="col-sm-9" id="reservationCode"></dd>

                    <dt class="col-sm-3">예약 상태</dt>
                    <dd class="col-sm-9" id="reservationStatus"></dd>

                    <dt class="col-sm-3">예약자 이름</dt>
                    <dd class="col-sm-9" id="guestName"></dd>

                    <dt class="col-sm-3">연락처</dt>
                    <dd class="col-sm-9" id="guestPhone"></dd>

                    <dt class="col-sm-3">객실</dt>
                    <dd class="col-sm-9" id="roomNumber"></dd>

                    <dt class="col-sm-3">예약 채널</dt>
                    <dd class="col-sm-9" id="channelName"></dd>

                    <dt class="col-sm-3">체크인 날짜</dt>
                    <dd class="col-sm-9" id="checkInDate"></dd>

                    <dt class="col-sm-3">체크아웃 날짜</dt>
                    <dd class="col-sm-9" id="checkOutDate"></dd>

                    <dt class="col-sm-3">투숙 인원</dt>
                    <dd class="col-sm-9" id="guestCount"></dd>

                    <dt class="col-sm-3">등록 일시</dt>
                    <dd class="col-sm-9" id="createdAt"></dd>

                    <dt class="col-sm-3">수정 일시</dt>
                    <dd class="col-sm-9" id="updatedAt"></dd>
                </dl>
            </div>
            <div class="card-footer text-right">
                <p id="deadlineNotice" class="text-muted mb-2 d-none"
                   th:attr="data-today=${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
                    체크인 당일이거나 이미 지난 예약은 취소·변경할 수 없습니다.
                </p>
                <a th:href="@{/admin/reservations}"
                   class="btn btn-secondary">목록으로</a>
                <a id="editLink" class="btn btn-primary d-none">예약 변경</a>
                <button type="button" id="openCancelButton"
                        class="btn btn-danger d-none"
                        data-toggle="modal" data-target="#cancelModal">
                    예약 취소
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cancelModal" tabindex="-1"
         aria-labelledby="cancelModalTitle" aria-hidden="true"
         data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="cancelForm" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="cancelModalTitle">
                            예약 취소
                        </h2>
                        <button type="button" class="close cancel-close"
                                data-dismiss="modal" aria-label="닫기">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <div class="modal-body">
                        <div class="alert alert-danger d-none"
                             data-form-error></div>

                        <p>예약 취소는 체크인 전날까지 가능합니다.</p>
                        <p id="refundLoading" role="status">
                            환불 예정 금액을 조회하는 중입니다.
                        </p>

                        <dl class="row d-none" id="refundDetails">
                            <dt class="col-sm-5">환불 규정</dt>
                            <dd class="col-sm-7" id="refundRule"></dd>

                            <dt class="col-sm-5">환불 대상 결제 합계</dt>
                            <dd class="col-sm-7" id="paymentTotal"></dd>

                            <dt class="col-sm-5">환불 예정 합계</dt>
                            <dd class="col-sm-7" id="refundTotal"></dd>
                        </dl>

                        <div class="form-group">
                            <label for="cancelReason">취소 사유 (선택)</label>
                            <textarea id="cancelReason" name="cancelReason"
                                      class="form-control" rows="3"
                                      maxlength="255"></textarea>
                        </div>

                        <p class="text-danger mb-0">
                            취소하면 되돌릴 수 없습니다.
                            환불액은 실제 취소 시점의 기준으로 계산됩니다.
                        </p>
                    </div>

                    <div class="modal-footer">
                        <button type="button"
                                class="btn btn-secondary cancel-close"
                                data-dismiss="modal">닫기</button>
                        <button type="submit" id="confirmCancelButton"
                                class="btn btn-danger" disabled>
                            예약 취소 확정
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const STATUS_LABELS = {
            CONFIRMED: '예약 확정',
            CANCELLED: '취소',
            NOSHOW: '노쇼',
            CHECKED_IN: '체크인 완료',
            CHECKED_OUT: '체크아웃 완료'
        };

        const REFUND_LABELS = {
            FULL: '전액 환불',
            PARTIAL: '50% 환불',
            NONE: '환불 대상 결제 없음'
        };

        const reservationId = location.pathname
            .match(/\/admin\/reservations\/(\d+)$/)?.[1];

        const cancelForm = document.getElementById('cancelForm');
        const openCancelButton = document.getElementById('openCancelButton');
        const confirmCancelButton =
            document.getElementById('confirmCancelButton');

        let previewReady = false;
        let cancelling = false;

        function money(value) {
            return Number(value).toLocaleString('ko-KR', {
                maximumFractionDigits: 2
            }) + '원';
        }

        async function loadDetail() {
            try {
                if (!reservationId) {
                    throw new Error('예약 주소가 올바르지 않습니다.');
                }

                const item = await api(
                    'GET', `/api/reservations/${reservationId}`
                );

                for (const field of [
                    'reservationCode', 'guestName', 'guestPhone',
                    'roomNumber', 'channelName'
                ]) {
                    document.getElementById(field).textContent =
                        item[field] ?? '-';
                }

                document.getElementById('reservationStatus').textContent =
                    STATUS_LABELS[item.status] || item.status;

                document.getElementById('checkInDate').textContent =
                    formatDate(item.checkInDate);
                document.getElementById('checkOutDate').textContent =
                    formatDate(item.checkOutDate);
                document.getElementById('guestCount').textContent =
                    `${item.guestCount}명`;
                document.getElementById('createdAt').textContent =
                    formatDateTime(item.createdAt);
                document.getElementById('updatedAt').textContent =
                    formatDateTime(item.updatedAt);

                document.getElementById('details').classList.remove('d-none');

                const notice = document.getElementById('deadlineNotice');

                if (item.status === 'CONFIRMED') {
                    if (item.checkInDate > notice.dataset.today) {
                        const editLink = document.getElementById('editLink');
                        editLink.href = `/admin/reservations/${reservationId}/edit`;
                        editLink.classList.remove('d-none');
                        openCancelButton.classList.remove('d-none');
                    } else {
                        notice.classList.remove('d-none');
                    }
                }
            } catch (error) {
                if (!error.shown) {
                    const message = document.getElementById('detailError');
                    message.textContent = error.message;
                    message.classList.remove('d-none');
                }
            } finally {
                document.getElementById('loading').classList.add('d-none');
            }
        }

        openCancelButton.addEventListener('click', async () => {
            if (cancelling) return;

            previewReady = false;
            confirmCancelButton.disabled = true;

            cancelForm.reset();
            clearFormError(cancelForm);

            document.getElementById('refundLoading')
                .classList.remove('d-none');
            document.getElementById('refundDetails')
                .classList.add('d-none');

            try {
                const params = new URLSearchParams({ reservationId });
                const preview = await api(
                    'GET', `/api/payments/refund-preview?${params}`
                );

                document.getElementById('refundRule').textContent =
                    REFUND_LABELS[preview.refundRule] || preview.refundRule;
                document.getElementById('paymentTotal').textContent =
                    money(preview.paymentTotal);
                document.getElementById('refundTotal').textContent =
                    money(preview.refundTotal);

                document.getElementById('refundDetails')
                    .classList.remove('d-none');

                previewReady = true;
                confirmCancelButton.disabled = false;
            } catch (error) {
                showFormError(cancelForm, error);
            } finally {
                document.getElementById('refundLoading')
                    .classList.add('d-none');
            }
        });

        cancelForm.addEventListener('submit', async e => {
            e.preventDefault();
            if (!previewReady || cancelling) return;

            clearFormError(cancelForm);
            cancelling = true;
            confirmCancelButton.disabled = true;
            let saved = false;

            document.querySelectorAll('.cancel-close').forEach(button => {
                button.disabled = true;
            });

            try {
                await api(
                    'POST',
                    `/api/reservations/${reservationId}/cancel`,
                    formToJson(cancelForm)
                );

                saved = true;
                location.reload();
            } catch (error) {
                showFormError(cancelForm, error);
            } finally {
                if (!saved) {
                    cancelling = false;
                    confirmCancelButton.disabled = !previewReady;

                    document.querySelectorAll('.cancel-close')
                        .forEach(button => {
                            button.disabled = false;
                        });
                }
            }
        });

        loadDetail();
    </script>
</section>
</body>
</html>
