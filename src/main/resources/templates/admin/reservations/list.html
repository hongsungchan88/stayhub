<!DOCTYPE html>
<!--/*
  예약 목록 SCR-RSV-01 (/admin/reservations).
  GET /api/reservations로 이름·연락처·예약번호·채널을 검색합니다.
  공통 레이아웃과 stayhub.js를 사용하며, 한 페이지는 20건입니다.
  예약 삭제 기능은 없습니다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('예약 목록 / 통합 검색', ~{::section})}">
<body>
<section class="content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">예약 검색</h2>
            </div>
            <div class="card-body">
                <form id="searchForm">
                    <div class="form-row align-items-end">
                        <div class="form-group col-md-3">
                            <label for="searchType">검색 항목</label>
                            <select id="searchType" name="searchType"
                                    class="form-control">
                                <option value="guestName">예약자 이름</option>
                                <option value="guestPhone">연락처</option>
                                <option value="reservationCode">예약번호</option>
                                <option value="channelName">채널</option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="keyword">검색어</label>
                            <input type="text" id="keyword" name="keyword"
                                   class="form-control" maxlength="100"
                                   placeholder="검색어를 입력하세요">
                        </div>
                        <div class="form-group col-md-3">
                            <button type="submit" class="btn btn-primary">
                                검색
                            </button>
                            <button type="reset"
                                    class="btn btn-outline-secondary">
                                초기화
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex align-items-center">
                <h2 class="card-title">예약 목록</h2>
                <span class="text-muted ml-3" id="totalCount"
                      aria-live="polite"></span>
                <a th:href="@{/admin/reservations/new}"
                   class="btn btn-primary btn-sm ml-auto">예약 등록</a>

                <button type="button" id="openNoShowButton"
                        class="btn btn-warning btn-sm ml-2"
                        data-toggle="modal" data-target="#noShowModal">
                    노쇼 처리
                </button>
            </div>
            <div class="card-body table-responsive p-0">
                <table class="table table-hover text-nowrap mb-0">
                    <thead>
                    <tr>
                        <th scope="col">예약번호</th>
                        <th scope="col">예약자</th>
                        <th scope="col">연락처</th>
                        <th scope="col">객실</th>
                        <th scope="col">채널</th>
                        <th scope="col">체크인</th>
                        <th scope="col">체크아웃</th>
                        <th scope="col">인원</th>
                        <th scope="col">상태</th>
                    </tr>
                    </thead>
                    <tbody id="rows">
                    <tr>
                        <td colspan="9" class="text-center text-muted py-5">
                            예약 목록을 불러오는 중입니다.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer" id="pagination"></div>
        </div>
    </div>

    <div class="modal fade" id="noShowModal" tabindex="-1"
         aria-labelledby="noShowModalTitle" aria-hidden="true"
         data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="noShowModalTitle">
                        노쇼 대상 예약
                    </h2>
                    <button type="button" class="close no-show-close"
                            data-dismiss="modal" aria-label="닫기">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body">
                    <div class="alert alert-danger d-none"
                         id="noShowError" role="alert"></div>

                    <p>
                        체크인 예정일이 오늘이거나 이미 지났으며,
                        아직 예약 확정 상태인 예약입니다.
                        실제 미입실 여부를 확인한 뒤 처리하세요.
                    </p>

                    <p class="text-danger">
                        노쇼 처리 시 환불하지 않으며,
                        기존 결제 상태는 유지됩니다.
                    </p>

                    <p id="noShowCount" class="text-muted"
                       aria-live="polite"></p>

                    <div class="table-responsive">
                        <table class="table table-hover text-nowrap">
                            <thead>
                            <tr>
                                <th scope="col">예약번호</th>
                                <th scope="col">예약자</th>
                                <th scope="col">연락처</th>
                                <th scope="col">객실</th>
                                <th scope="col">체크인</th>
                                <th scope="col">체크아웃</th>
                                <th scope="col">처리</th>
                            </tr>
                            </thead>
                            <tbody id="noShowRows"></tbody>
                        </table>
                    </div>

                    <div id="noShowPagination"></div>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary no-show-close"
                            data-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/reservations';
        const STATUS_LABELS = {
            CONFIRMED: '예약 확정',
            CANCELLED: '취소',
            NOSHOW: '노쇼',
            CHECKED_IN: '체크인 완료',
            CHECKED_OUT: '체크아웃 완료'
        };

        let search = { searchType: 'guestName', keyword: '' };
        let requestSequence = 0;
        const searchForm = document.getElementById('searchForm');

        searchForm.addEventListener('submit', e => {
            e.preventDefault();
            search = {
                searchType: searchForm.elements.searchType.value,
                keyword: searchForm.elements.keyword.value.trim()
            };
            load(0);
        });

        searchForm.addEventListener('reset', () => {
            search = { searchType: 'guestName', keyword: '' };
            load(0);
        });

        async function load(page) {
            const sequence = ++requestSequence;

            try {
                const params = new URLSearchParams({ ...search, page });
                const result = await api('GET', `${API_URL}?${params}`);

                // 빠르게 연속 검색했을 때 이전 결과가 덮어쓰지 않도록 합니다.
                if (sequence !== requestSequence) return;

                document.getElementById('totalCount').textContent =
                    `총 ${result.totalElements}건`;

                renderRows(document.getElementById('rows'), result.content, item => `
            <tr>
              <td>
                <a href="/admin/reservations/${esc(item.id)}">${esc(item.reservationCode)}
                </a>
              </td>
              <td>${esc(item.guestName)}</td>
              <td>${esc(item.guestPhone)}</td>
              <td>${esc(item.roomNumber)}</td>
              <td>${esc(item.channelName)}</td>
              <td>${esc(formatDate(item.checkInDate))}</td>
              <td>${esc(formatDate(item.checkOutDate))}</td>
              <td>${esc(item.guestCount)}명</td>
              <td>${esc(STATUS_LABELS[item.status] || item.status)}</td>
            </tr>
          `);

                renderPagination(
                    document.getElementById('pagination'), result, load
                );
            } catch (error) {
                if (sequence !== requestSequence) return;

                document.getElementById('rows').innerHTML =
                    '<tr><td colspan="9" class="text-center text-muted py-5">' +
                    '목록을 불러오지 못했습니다. 다시 검색해 주세요.</td></tr>';

                document.getElementById('totalCount').textContent = '';
                document.getElementById('pagination').innerHTML = '';
                showError(error);
            }
        }

        const noShowRows = document.getElementById('noShowRows');
        const noShowError = document.getElementById('noShowError');

        let noShowSequence = 0;
        let noShowBusy = false;

        function showNoShowError(error) {
            if (!error.shown) {
                noShowError.textContent =
                    error.message || '노쇼 처리 중 오류가 발생했습니다.';
                noShowError.classList.remove('d-none');
            }
        }

        async function loadNoShowCandidates(page) {
            if (noShowBusy) return;

            const sequence = ++noShowSequence;

            noShowError.classList.add('d-none');
            noShowError.textContent = '';
            document.getElementById('noShowCount').textContent = '';
            document.getElementById('noShowPagination').innerHTML = '';

            noShowRows.innerHTML =
                '<tr><td colspan="7" class="text-center text-muted py-4">' +
                '노쇼 대상 예약을 불러오는 중입니다.</td></tr>';

            try {
                const result = await api(
                    'GET', `${API_URL}/no-show-candidates?page=${page}`
                );

                if (sequence !== noShowSequence) return;

                document.getElementById('noShowCount').textContent =
                    `대상 예약 총 ${result.totalElements}건`;

                if (result.content.length === 0) {
                    noShowRows.innerHTML =
                        '<tr><td colspan="7" class="text-center text-muted py-4">' +
                        '노쇼 처리 대상 예약이 없습니다.</td></tr>';
                } else {
                    renderRows(noShowRows, result.content, item => `
                <tr>
                    <td>${esc(item.reservationCode)}</td>
                    <td>${esc(item.guestName)}</td>
                    <td>${esc(item.guestPhone)}</td>
                    <td>${esc(item.roomNumber)}</td>
                    <td>${esc(formatDate(item.checkInDate))}</td>
                    <td>${esc(formatDate(item.checkOutDate))}</td>
                    <td>
                        <button type="button"
                                class="btn btn-warning btn-sm"
                                data-no-show-id="${esc(item.id)}"
                                data-reservation-code="${esc(item.reservationCode)}">
                            노쇼 처리
                        </button>
                    </td>
                </tr>
            `);
                }

                renderPagination(
                    document.getElementById('noShowPagination'),
                    result,
                    loadNoShowCandidates
                );
            } catch (error) {
                if (sequence !== noShowSequence) return;

                noShowRows.innerHTML =
                    '<tr><td colspan="7" class="text-center text-muted py-4">' +
                    '대상 목록을 불러오지 못했습니다. 팝업을 다시 열어 주세요.' +
                    '</td></tr>';

                showNoShowError(error);
            }
        }

        document.getElementById('openNoShowButton')
            .addEventListener('click', () => {
                loadNoShowCandidates(0);
            });

        noShowRows.addEventListener('click', async e => {
            const button = e.target.closest('[data-no-show-id]');
            if (!button || noShowBusy) return;

            const id = button.dataset.noShowId;
            const code = button.dataset.reservationCode;

            if (!window.confirm(
                `예약 ${code}을 노쇼 처리할까요?\n` +
                '실제 미입실 여부를 확인해 주세요. 환불은 진행되지 않습니다.'
            )) {
                return;
            }

            noShowBusy = true;
            noShowError.classList.add('d-none');
            noShowError.textContent = '';

            noShowRows.querySelectorAll('[data-no-show-id]')
                .forEach(item => {
                    item.disabled = true;
                });

            document.querySelectorAll('.no-show-close')
                .forEach(item => {
                    item.disabled = true;
                });

            try {
                await api('POST', `${API_URL}/${id}/no-show`);

                toast('노쇼 처리되었습니다.');

                noShowBusy = false;

                // 처리한 예약을 대상 목록에서 제외하고 일반 목록도 갱신합니다.
                await Promise.all([
                    loadNoShowCandidates(0),
                    load(0)
                ]);
            } catch (error) {
                showNoShowError(error);
            } finally {
                noShowBusy = false;

                noShowRows.querySelectorAll('[data-no-show-id]')
                    .forEach(item => {
                        item.disabled = false;
                    });

                document.querySelectorAll('.no-show-close')
                    .forEach(item => {
                        item.disabled = false;
                    });
            }
        });

        load(0);
    </script>
</section>
</body>
</html>
