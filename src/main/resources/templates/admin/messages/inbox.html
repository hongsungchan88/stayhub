<!DOCTYPE html>
<!--/*
  통합 인박스 SCR-COM-01 (/admin/messages) — COM-001. 목록 모양은 admin/guidebooks/list.html 을 따르고 2분할만 새로 만듦.

  이 화면이 하는 일
    왼쪽: GET /api/message-threads?channelId=&page= 로 스레드 20건씩. 미읽음은 굵게, 마지막 메시지가 게스트 것이면 "수동 응대 필요"(FLW-07).
    스레드를 누르면 PUT /api/message-threads/{id}/read → GET /api/message-threads/{id}/messages 로 오른쪽 대화창을 그림.
    [전송] → POST /api/message-threads/{id}/messages → 대화창·목록 다시 불러오기. 입력 오류는 입력칸 아래에.
  1차는 채널 연동이 없어 게스트 메시지는 data.sql 샘플과 POST /api/message-threads/inbound(시연용)로만 들어옵니다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('통합 인박스', ~{::section})}">
<body>
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <!-- 왼쪽: 스레드 목록 -->
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header d-flex align-items-center">
                        <select id="channelId" class="form-control form-control-sm w-auto" aria-label="채널" onchange="load(0)">
                            <option value="">전체 채널</option>
                        </select>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th style="width: 110px">채널</th>
                                <th>게스트 / 최근 메시지</th>
                                <th style="width: 130px">최근 수신</th>
                            </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                    <div class="card-footer" id="pagination"></div>
                </div>
            </div>

            <!-- 오른쪽: 대화창 -->
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title h6 mb-0" id="threadTitle">스레드를 선택하세요</h2>
                        <span class="ml-2 text-muted small" id="threadReservation"></span>
                    </div>
                    <div class="card-body" id="conversation" style="height: 460px; overflow-y: auto;"></div>

                    <!-- COM-003 v2: AI 답변 초안 영역. 1차는 자리만 두고 숨깁니다. -->
                    <div class="card-body border-top d-none" id="aiDraft"></div>

                    <div class="card-footer">
                        <form id="replyForm" novalidate>
                            <div class="alert alert-danger d-none" data-form-error></div>
                            <div class="form-group mb-2">
                                <label for="replyContent" class="sr-only">답장 내용</label>
                                <textarea id="replyContent" name="content" class="form-control" rows="3" maxlength="1000"
                                          placeholder="답장 내용을 입력하세요" disabled></textarea>
                            </div>
                            <div class="d-flex align-items-center">
                                <small class="text-muted"><span id="replyCount">0</span> / 1,000자</small>
                                <button type="submit" class="btn btn-primary btn-sm ml-auto" id="replySubmit" disabled>전송</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
      const API_URL = '/api/message-threads';

      let currentPage = 0;
      let currentThreadId = null;

      async function loadChannels() {
        try {
          const select = document.getElementById('channelId');
          for (const channel of await api('GET', '/api/channels')) {
            select.add(new Option(channel.channelName, channel.id));
          }
        } catch (error) {
          showError(error);
        }
      }

      async function load(page) {
        const params = new URLSearchParams({ page });
        const channelId = document.getElementById('channelId').value;
        if (channelId) params.set('channelId', channelId);
        try {
          const result = await api('GET', `${API_URL}?${params}`);
          currentPage = page;
          renderRows(document.getElementById('rows'), result.content, item => `
            <tr class="${item.threadId === currentThreadId ? 'table-active' : ''}">
              <td>${esc(item.channelName)}</td>
              <td>
                <button type="button" class="btn btn-link p-0 text-left ${item.isRead ? '' : 'font-weight-bold'}"
                        onclick="openThread(${item.threadId})">${esc(item.guestName || '(이름 없음)')}</button>
                ${item.needsReply ? '<span class="badge badge-warning ml-1">수동 응대 필요</span>' : ''}
                <div class="small text-muted text-truncate" style="max-width: 260px">${esc(item.lastMessagePreview)}</div>
              </td>
              <td class="small">${formatDateTime(item.lastMessageAt)}</td>
            </tr>`);
          renderPagination(document.getElementById('pagination'), result, load);
        } catch (error) {
          showError(error);
        }
      }

      async function openThread(threadId) {
        try {
          if (threadId !== currentThreadId) await api('PUT', `${API_URL}/${threadId}/read`);
          const thread = await api('GET', `${API_URL}/${threadId}/messages`);
          currentThreadId = threadId;
          renderThread(thread);
          setReplyEnabled(true);
          load(currentPage); // 읽음 표시·선택 강조 반영
        } catch (error) {
          showError(error);
        }
      }

      function renderThread(thread) {
        document.getElementById('threadTitle').textContent =
            `${thread.channelName ?? ''} · ${thread.guestName || '(이름 없음)'}`;
        document.getElementById('threadReservation').textContent =
            thread.reservationCode ? `예약 번호 ${thread.reservationCode}` : '';

        const conversation = document.getElementById('conversation');
        // 메시지 본문은 esc() 로 감싸고 줄바꿈만 pre-wrap 으로 살립니다.
        conversation.innerHTML = thread.messages.map(m => `
          <div class="d-flex mb-2 ${m.direction === 'OUT' ? 'justify-content-end' : ''}">
            <div class="p-2 rounded ${m.direction === 'OUT' ? 'bg-primary text-white' : 'bg-light'}" style="max-width: 75%">
              <div style="white-space: pre-wrap; word-break: break-word">${esc(m.content)}</div>
              <div class="small ${m.direction === 'OUT' ? 'text-white-50 text-right' : 'text-muted'}">${formatDateTime(m.createdAt)}</div>
            </div>
          </div>`).join('');
        conversation.scrollTop = conversation.scrollHeight;
      }

      function setReplyEnabled(enabled) {
        document.getElementById('replyContent').disabled = !enabled;
        document.getElementById('replySubmit').disabled = !enabled;
      }

      const replyForm = document.getElementById('replyForm');
      const replyContent = document.getElementById('replyContent');

      replyContent.addEventListener('input', () => {
        document.getElementById('replyCount').textContent = replyContent.value.length.toLocaleString();
      });

      replyForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (currentThreadId == null) return;
        clearFormError(replyForm);
        setReplyEnabled(false); // 두 번 눌러 두 번 보내지 않게
        try {
          await api('POST', `${API_URL}/${currentThreadId}/messages`, { content: replyContent.value });
          replyContent.value = '';
          document.getElementById('replyCount').textContent = '0';
          toast('전송되었습니다.');
          await openThread(currentThreadId);
        } catch (error) {
          showFormError(replyForm, error);
        } finally {
          setReplyEnabled(true);
        }
      });

      loadChannels();
      load(0);
    </script>
</section>
</body>
</html>
