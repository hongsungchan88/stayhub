<!DOCTYPE html>
<!--/*
  추가 요금 등록 SCR-PAY-02(/admin/additional-charges) — 추가 요금 목록 + 등록·수정 팝업.
  가이드북 목록(guidebooks/list.html)·편집 폼(form.html)과 청소 스케줄(housekeeping-tasks/list.html)을 따라 만들었습니다.

  이 화면이 하는 일
    GET /api/additional-charges?page=로 20건씩 불러와 표로 그립니다. 정산 여부는 색 배지(미정산은 노랑)로 보여 줍니다.
    예약 칸에는 예약 번호와 손님 이름을 보여 줍니다(추가 요금 목록 응답에 함께 옴).
    [추가 요금 등록] → 팝업 → POST /api/additional-charges
    [수정]           → 같은 팝업에 지금 값을 채워 → PUT /api/additional-charges/{id}
    팝업의 예약은 목록에서 고릅니다. 처음에는 최근 예약 20건이 나오고, 손님 이름·예약 번호·연락처로 검색할 수 있습니다
    (GET /api/reservations?searchType=&keyword=, 팀원 B의 #42). 취소·노쇼 예약은 목록에서 뺍니다(서버도 등록을 막음).
    "기존 결제에 합산"을 체크하면 합산할 결제를 고르는 칸이 나옵니다. 고른 예약의 결제 완료(COMPLETED) 결제만
    목록에 넣습니다. 서버도 같은 예약·결제 완료 건에만 합산을 허용합니다(PAY-002, #27).

  가이드북과 다른 점
    - 삭제 버튼 없음 — 추가 요금은 삭제 기능이 없는 테이블
    - 검색 조건 없음 — 추가 요금 목록 API에 필터가 없음
    - 화면 목록 정의서 비고 "체크아웃 화면에서도 진입"은 체크인/체크아웃 화면(SCR-RSV-05, 팀원 B)이 생긴 뒤 그쪽에서 이 팝업을 열도록 맞춤
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('추가 요금 등록', ~{::section})}">
<body>
<section class="content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <button type="button" class="btn btn-primary btn-sm ml-auto" onclick="openChargeModal()">추가 요금 등록</button>
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th style="width: 150px">발생 일시</th>
                        <th style="width: 190px">예약</th>
                        <th style="width: 130px">요금 유형</th>
                        <th>상세 내역</th>
                        <th style="width: 120px">금액</th>
                        <th style="width: 130px">청구</th>
                        <th style="width: 90px">정산</th>
                        <th style="width: 80px">관리</th>
                    </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <div class="card-footer" id="pagination"></div>
        </div>
    </div>

    <!--/* 등록·수정 팝업. name = AdditionalChargeCreateRequest/UpdateRequest 필드명 */-->
    <div class="modal fade" id="chargeModal" tabindex="-1" role="dialog" aria-labelledby="chargeModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <form id="chargeForm" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="chargeModalTitle">추가 요금 등록</h2>
                    </div>
                    <div class="modal-body">
                        <div class="alert alert-danger d-none" data-form-error></div>
                        <div class="form-group">
                            <label for="reservationId" class="required">예약</label>
                            <!--/* 검색 칸에는 name이 없어서 저장 요청에 들어가지 않습니다 */-->
                            <div class="input-group input-group-sm mb-1">
                                <div class="input-group-prepend">
                                    <select id="reservationSearchType" class="custom-select custom-select-sm" aria-label="예약 검색 항목">
                                        <option value="guestName">손님 이름</option>
                                        <option value="reservationCode">예약 번호</option>
                                        <option value="guestPhone">연락처</option>
                                    </select>
                                </div>
                                <input type="text" id="reservationKeyword" class="form-control" maxlength="100"
                                       placeholder="검색어" aria-label="예약 검색어">
                                <div class="input-group-append">
                                    <button type="button" class="btn btn-outline-secondary" id="reservationSearch">검색</button>
                                </div>
                            </div>
                            <select id="reservationId" name="reservationId" class="form-control"></select>
                            <small class="form-text text-muted">최근 예약 20건이 먼저 나옵니다. 찾는 예약이 없으면 검색하세요</small>
                        </div>
                        <div class="form-group">
                            <label for="chargeType" class="required">요금 유형</label>
                            <select id="chargeType" name="chargeType" class="form-control">
                                <option value="">선택해 주세요</option>
                                <option value="MINIBAR">미니바</option>
                                <option value="EARLY_CHECKIN">얼리 체크인</option>
                                <option value="LATE_CHECKOUT">레이트 체크아웃</option>
                                <option value="SERVICE">부대 서비스</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="amount" class="required">금액(원)</label>
                            <input type="number" id="amount" name="amount" class="form-control w-auto" min="0" step="1">
                        </div>
                        <div class="form-group">
                            <label for="description">상세 내역</label>
                            <input type="text" id="description" name="description" class="form-control" maxlength="255"
                                   placeholder="예: 생수 2병, 맥주 1캔">
                        </div>
                        <div class="form-check">
                            <input type="checkbox" id="isMerged" name="isMerged" class="form-check-input">
                            <label for="isMerged" class="form-check-label">기존 결제에 합산</label>
                        </div>
                        <div class="form-group mt-2" id="paymentGroup">
                            <label for="paymentId" class="required">합산할 결제</label>
                            <select id="paymentId" name="paymentId" class="form-control"></select>
                            <small class="form-text text-muted">고른 예약의 결제 완료 건만 나옵니다</small>
                        </div>
                        <div class="form-check mt-2">
                            <input type="checkbox" id="isSettled" name="isSettled" class="form-check-input">
                            <label for="isSettled" class="form-check-label">정산(청구) 완료</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
      const API_URL = '/api/additional-charges';
      const PAYMENTS_URL = '/api/payments';
      const RESERVATIONS_URL = '/api/reservations';
      const TYPE_LABELS = { MINIBAR: '미니바', EARLY_CHECKIN: '얼리 체크인', LATE_CHECKOUT: '레이트 체크아웃', SERVICE: '부대 서비스' };
      // 예약 상태 이름. 예약 목록 화면(reservations/list.html)과 같게 둡니다
      const RESERVATION_STATUS = {
        CONFIRMED: '예약 확정', CANCELLED: '취소', NOSHOW: '노쇼', CHECKED_IN: '체크인 완료', CHECKED_OUT: '체크아웃 완료',
      };

      const chargeForm = document.getElementById('chargeForm');
      const reservationSelect = document.getElementById('reservationId');
      const searchTypeSelect = document.getElementById('reservationSearchType');
      const keywordInput = document.getElementById('reservationKeyword');
      const mergedInput = document.getElementById('isMerged');
      const paymentSelect = document.getElementById('paymentId');
      let currentPage = 0;
      let chargesById = {}; // 지금 페이지의 추가 요금. 버튼에는 id만 넣고 나머지는 여기서 꺼냅니다
      let editingId = null; // 수정 중인 추가 요금. 등록이면 null
      // 취소·노쇼 예약에는 추가 요금을 새로 걸지 않습니다(서버도 막음). 수정 중인 지금 예약은 예외로 보여 줍니다
      const CLOSED_STATUSES = ['CANCELLED', 'NOSHOW'];

      /** 예약 한 건을 불러옵니다. 없는 예약이면 null. */
      async function fetchReservation(id) {
        try {
          return await api('GET', `${RESERVATIONS_URL}/${id}`);
        } catch (error) {
          return null;
        }
      }

      // 예약 번호·손님 이름은 추가 요금 목록 응답에 함께 옵니다. 예약을 찾지 못한 줄은 #ID로 보입니다
      function reservationCell(c) {
        return c.reservationCode
          ? `${esc(c.reservationCode)}<br><small class="text-muted">${esc(c.guestName)}</small>` : `#${c.reservationId}`;
      }

      function reservationOption(r) {
        const status = RESERVATION_STATUS[r.status] ?? r.status;
        return `<option value="${r.id}">${esc(r.reservationCode)} · ${esc(r.guestName)} · ${esc(r.roomNumber)}호 · `
          + `${formatDate(r.checkInDate)}~${formatDate(r.checkOutDate)} · ${esc(status)}</option>`;
      }

      async function load(page) {
        try {
          const result = await api('GET', `${API_URL}?page=${page}`);
          if (result.content.length === 0 && page > 0) return load(page - 1);
          currentPage = page;
          chargesById = Object.fromEntries(result.content.map(c => [c.id, c]));
          renderRows(document.getElementById('rows'), result.content, c => `
            <tr>
              <td>${formatDateTime(c.chargedAt)}</td>
              <td>${reservationCell(c)}</td>
              <td>${TYPE_LABELS[c.chargeType] ?? esc(c.chargeType)}</td>
              <td>${esc(c.description ?? '')}</td>
              <td>${formatMoney(c.amount)}</td>
              <td>${c.isMerged ? `결제 #${c.paymentId}에 합산` : '별도 청구'}</td>
              <td>${c.isSettled ? '<span class="badge badge-success">완료</span>' : '<span class="badge badge-warning">미정산</span>'}</td>
              <td><button type="button" class="btn btn-outline-secondary btn-xs" onclick="openChargeModal(${c.id})">수정</button></td>
            </tr>`);
          renderPagination(document.getElementById('pagination'), result, load);
        } catch (error) {
          showError(error);
        }
      }

      /**
       * 예약 선택 목록을 채웁니다. 검색어가 없으면 최근 예약 20건 중 취소·노쇼가 아닌 예약입니다.
       * keepId가 있으면(수정할 때 지금 예약) 검색 결과에 없어도 맨 위에 넣어 고른 상태로 둡니다.
       */
      async function loadReservations(keepId) {
        const params = new URLSearchParams({ searchType: searchTypeSelect.value, keyword: keywordInput.value.trim(), page: 0 });
        const result = await api('GET', `${RESERVATIONS_URL}?${params}`);
        const list = result.content.filter(r => !CLOSED_STATUSES.includes(r.status) || r.id === keepId);
        if (keepId && !list.some(r => r.id === keepId)) {
          const kept = await fetchReservation(keepId);
          if (kept) list.unshift(kept);
        }
        reservationSelect.innerHTML = '<option value="">선택해 주세요</option>' + list.map(reservationOption).join('');
        if (keepId) reservationSelect.value = String(keepId);
        if (!list.length) reservationSelect.innerHTML = '<option value="">검색 결과가 없습니다</option>';
      }

      // 고른 예약의 결제 완료 결제로 "합산할 결제" 목록을 채웁니다.
      // 결제 목록 API에 예약 필터가 없어서 끝 페이지까지 불러 화면에서 고릅니다.
      async function loadPayments(reservationId) {
        paymentSelect.innerHTML = '<option value="">선택해 주세요</option>';
        if (!reservationId) return;
        const payments = [];
        for (let page = 0; ; page++) {
          const result = await api('GET', `${PAYMENTS_URL}?page=${page}`);
          payments.push(...result.content.filter(p =>
            p.reservationId === Number(reservationId) && p.paymentStatus === 'COMPLETED'));
          if (page + 1 >= result.totalPages) break;
        }
        paymentSelect.innerHTML += payments.map(p =>
          `<option value="${p.id}">#${p.id} · ${formatMoney(p.paymentAmount)} · ${formatDate(p.createdAt)}</option>`).join('');
      }

      function toggleMerged() {
        document.getElementById('paymentGroup').classList.toggle('d-none', !mergedInput.checked);
      }

      function searchReservations() {
        const keep = Number(reservationSelect.value) || null;
        loadReservations(keep)
          .then(() => loadPayments(reservationSelect.value))
          .catch(showError);
      }

      mergedInput.addEventListener('change', toggleMerged);
      reservationSelect.addEventListener('change', () => loadPayments(reservationSelect.value).catch(showError));
      document.getElementById('reservationSearch').addEventListener('click', searchReservations);
      keywordInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { // 검색 칸에서 Enter를 눌러도 저장되지 않고 검색만 합니다
          e.preventDefault();
          searchReservations();
        }
      });

      // id가 없으면 등록, 있으면 수정(지금 값을 채움)
      async function openChargeModal(id) {
        editingId = id ?? null;
        clearFormError(chargeForm);
        chargeForm.reset();
        keywordInput.value = '';
        document.getElementById('chargeModalTitle').textContent = id ? '추가 요금 수정' : '추가 요금 등록';
        paymentSelect.innerHTML = '<option value="">선택해 주세요</option>';
        const c = id ? chargesById[id] : null;
        try {
          // 예약·결제 목록을 먼저 채워야 fillForm이 reservationId·paymentId를 고를 수 있음
          await loadReservations(c ? c.reservationId : null);
          if (c) await loadPayments(c.reservationId);
        } catch (error) {
          showError(error);
        }
        if (c) fillForm(chargeForm, c);
        toggleMerged();
        $('#chargeModal').modal('show');
      }

      chargeForm.addEventListener('submit', async e => {
        e.preventDefault();
        clearFormError(chargeForm);
        const body = formToJson(chargeForm);
        if (!body.isMerged) body.paymentId = null; // 별도 청구면 결제를 보내지 않음(서버도 반려)
        try {
          if (editingId) await api('PUT', `${API_URL}/${editingId}`, body);
          else await api('POST', API_URL, body);
          $('#chargeModal').modal('hide');
          toast('저장되었습니다.');
          load(editingId ? currentPage : 0);
        } catch (error) {
          showFormError(chargeForm, error);
        }
      });

      load(0);
    </script>
</section>
</body>
</html>
