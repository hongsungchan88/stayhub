<!DOCTYPE html>
<!--/*
  비밀번호 찾기 화면 SCR-ACC-03 (/password-reset). 로그인 없이 열립니다. 로그인 화면처럼 레이아웃 없는 단독 화면입니다.

  이 화면이 하는 일 (ACC-003, 화면 흐름도 FLW-01 "[비밀번호 찾기] 클릭 → SCR-ACC-03")
    ① 주소에 token 이 없으면: 아이디 또는 이메일 입력 → POST /api/password-reset/request
       → 성공하면 "재설정 링크를 보냈습니다(30분)" 안내. 미등록이면 서버 문구("등록되지 않은 아이디 또는 이메일입니다.")를 폼 위에.
    ② 주소에 ?token=... 이 있으면(재설정 링크로 들어옴): 새 비밀번호·확인 입력 → POST /api/password-reset/confirm
       → 성공하면 완료 토스트를 띄우고 /login 으로 이동(기능 정의서 결과 "비밀번호 재설정 완료 알림").
       만료·사용된·이전 링크는 서버 문구를 폼 위에 보여 주고, ① 로 가는 [다시 요청하기] 링크를 함께 둡니다.

  주의
    token 은 폼 칸으로 두지 않고 스크립트가 주소에서 읽어 보냅니다(숨은 칸에 오류 표시가 붙으면 화면에 안 보이므로).
    비밀번호 확인 칸은 화면에서만 비교하고 API 로 보내지 않습니다(name 없음).
    이메일은 실제로 보내지 않고 서버 로그에 토큰을 찍습니다(총괄 공지).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 찾기 - stayhub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
    <link rel="stylesheet" th:href="@{/css/stayhub.css}">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
    <script th:src="@{/js/stayhub.js}"></script>
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo"><b>stayhub</b></div>
    <div class="card">
        <div class="card-body login-card-body">

            <!--/* ① 재설정 링크 요청 (주소에 token 이 없을 때) */-->
            <th:block th:if="${param.token == null}">
                <p class="login-box-msg">비밀번호 찾기</p>

                <form id="requestForm" novalidate>
                    <div class="alert alert-danger d-none" data-form-error></div>
                    <div class="form-group">
                        <label for="loginIdOrEmail" class="required">아이디 또는 이메일</label>
                        <input type="text" class="form-control" id="loginIdOrEmail" name="loginIdOrEmail" autocomplete="username" autofocus>
                        <small class="form-text text-muted">가입할 때 쓴 이메일로 재설정 링크를 보내 드립니다.</small>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">재설정 링크 받기</button>
                </form>

                <div id="requestDone" class="alert alert-success d-none mb-0">
                    가입하신 이메일로 재설정 링크를 보냈습니다.<br>30분 안에 비밀번호를 바꿔 주세요.
                </div>
            </th:block>

            <!--/* ② 새 비밀번호 저장 (재설정 링크 ?token=... 으로 들어왔을 때) */-->
            <th:block th:if="${param.token != null}">
                <p class="login-box-msg">새 비밀번호 설정</p>

                <form id="confirmForm" novalidate>
                    <div class="alert alert-danger d-none" data-form-error></div>
                    <div class="form-group">
                        <label for="newPassword" class="required">새 비밀번호</label>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" autocomplete="new-password" autofocus>
                        <small class="form-text text-muted">8자 이상, 특수문자 1개 이상</small>
                    </div>
                    <div class="form-group">
                        <label for="newPasswordConfirm" class="required">새 비밀번호 확인</label>
                        <input type="password" class="form-control" id="newPasswordConfirm" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">변경하기</button>
                </form>

                <p class="mt-3 mb-0 text-center small">
                    링크가 만료되었나요? <a th:href="@{/password-reset}">다시 요청하기</a>
                </p>
            </th:block>

            <p class="mt-3 mb-0 text-center">
                <a th:href="@{/login}">로그인으로 돌아가기</a>
            </p>
        </div>
    </div>
</div>

<script>
  const requestForm = document.getElementById('requestForm');
  const confirmForm = document.getElementById('confirmForm');

  // ① 재설정 링크 요청
  if (requestForm) {
    requestForm.addEventListener('submit', async e => {
      e.preventDefault();
      clearFormError(requestForm);
      const button = requestForm.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        // 성공 문구는 api() 가 서버 message 로 토스트를 띄웁니다. 화면에도 남겨 둡니다.
        await api('POST', '/api/password-reset/request', formToJson(requestForm));
        requestForm.classList.add('d-none');
        document.getElementById('requestDone').classList.remove('d-none');
      } catch (error) {
        showFormError(requestForm, error);
        button.disabled = false;
      }
    });
  }

  // ② 새 비밀번호 저장
  if (confirmForm) {
    confirmForm.addEventListener('submit', async e => {
      e.preventDefault();
      clearFormError(confirmForm);

      const confirmInput = document.getElementById('newPasswordConfirm');
      if (confirmInput.value !== document.getElementById('newPassword').value) {
        showFieldError(confirmInput, '새 비밀번호가 서로 다릅니다.');
        return;
      }

      const body = formToJson(confirmForm);
      body.token = new URLSearchParams(location.search).get('token');

      const button = confirmForm.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        // 완료 문구("비밀번호가 재설정되었습니다...")는 api() 가 토스트로 띄우고, 로그인 화면에서도 이어서 보입니다.
        await api('POST', '/api/password-reset/confirm', body);
        location.href = '/login';
      } catch (error) {
        showFormError(confirmForm, error);
        button.disabled = false;
      }
    });
  }

  /** 화면에서만 하는 검사(비밀번호 확인)를 showFormError 와 같은 모양으로 칸 아래에 표시합니다. */
  function showFieldError(input, message) {
    input.classList.add('is-invalid');
    const feedback = document.createElement('div');
    feedback.className = 'invalid-feedback';
    feedback.textContent = message;
    input.insertAdjacentElement('afterend', feedback);
    input.focus();
  }
</script>
</body>
</html>
