<!DOCTYPE html>
<!--/*
  숙소 소개 SCR-GST-01 (/) — 게스트(비로그인) 화면의 참고 구현. GST-03·04 담당자는 이 파일을 복사해서 시작하세요.

  이 화면이 하는 일
    GET /api/public/property 로 숙소명·소개 문구·시설·사진을 불러와 그립니다.
    숙소가 게시(PUBLISHED) 전이면 서버가 "준비 중인 숙소입니다." 를 돌려주고, 화면은 그 문구만 보여 줍니다.
    불러오는 동안은 회색 자리 표시(#loading)를 보여 줍니다.
    첫 화면(히어로)은 사진이 있으면 첫 사진을, 없으면 옅은 파랑 면을 배경으로 씁니다.
    사진이 2장 이상일 때만 갤러리를 보여 주고, 시설이 없으면 시설 영역을 숨깁니다.
    히어로 아래 검색 카드(날짜·인원 → [빈 객실 조회], 기본값 오늘~내일·2명)는 /reserve?checkIn=&checkOut=&guests= 로 이동합니다(SCR-GST-03).
    체크인을 바꾸면 체크아웃은 체크인 다음 날부터 고를 수 있고, 그보다 이르면 자동으로 맞춥니다. 리뷰 영역은 CMS-005 v2 이관이라 없습니다.
    모양은 static/css/guest.css 에 있습니다. 화면마다 따로 만들지 마세요.

  따라 만들 때 바꿀 곳 (★ 로 검색)
    - layout(...) 의 화면 제목과 현재 메뉴
    - 본문 HTML — 내 화면 모양으로
    - <script> 맨 위 API 주소와 render() — 내 API 응답에 맞게
    - 사용자가 입력한 글자는 꼭 esc() 로 감싸기. 게스트 화면이라 누구나 보므로 더 중요합니다
    - 오류는 toast 가 아니라 화면 안(#notice)에 보여 줍니다(게스트 레이아웃에는 토스트가 없음)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{guest/layout :: layout('숙소 소개', 'intro', ~{::section})}"><!--/* ★ 바꿀 곳: 화면 제목·현재 메뉴 */-->
<body>
<section>
    <div id="notice" class="alert alert-secondary text-center py-5 d-none" role="status"></div>

    <div id="loading" role="status">
        <span class="sr-only">불러오는 중…</span>
        <div class="guest-skeleton mb-4" style="height: 340px"></div>
        <div class="guest-skeleton mb-3" style="height: 24px; width: 30%"></div>
        <div class="guest-skeleton" style="height: 96px"></div>
    </div>

    <div id="property" class="d-none">
        <div id="hero" class="guest-hero">
            <h1 id="propertyName"></h1>
        </div>

        <!--/* 검색 카드 (FLW-08). 날짜·인원을 담아 /reserve 로 이동하면 그 화면이 바로 빈 객실을 조회합니다 */-->
        <form class="card guest-search" method="get" th:action="@{/reserve}" aria-label="빈 객실 조회">
            <div class="card-body pb-2">
                <div class="form-row align-items-end">
                    <div class="col-md-4 form-group">
                        <label for="widgetCheckIn">체크인</label>
                        <input type="date" id="widgetCheckIn" name="checkIn" class="form-control" required>
                    </div>
                    <div class="col-md-4 form-group">
                        <label for="widgetCheckOut">체크아웃</label>
                        <input type="date" id="widgetCheckOut" name="checkOut" class="form-control" required>
                    </div>
                    <div class="col-md-2 form-group">
                        <label for="widgetGuests">인원</label>
                        <input type="number" id="widgetGuests" name="guests" class="form-control" min="1" value="2" required>
                    </div>
                    <div class="col-md-2 form-group">
                        <button type="submit" class="btn btn-primary btn-block text-nowrap px-1">빈 객실 조회</button>
                    </div>
                </div>
            </div>
        </form>

        <div class="mb-5">
            <h2 class="h5 mb-3">숙소 소개</h2>
            <p id="description" class="mb-0"></p>
        </div>

        <div id="facilitiesBox" class="mb-5 d-none">
            <h2 class="h5 mb-3">시설</h2>
            <ul id="facilities" class="list-unstyled mb-0"></ul>
        </div>

        <div id="galleryBox" class="mb-4 d-none">
            <h2 class="h5 mb-3">사진</h2>
            <div id="gallery" class="row"></div>
        </div>
    </div>

    <script>
      const API_URL = '/api/public/property'; // ★ 바꿀 곳

      // ★ 바꿀 곳: 시설 이름별 아이콘 (없는 이름은 체크 표시)
      const FACILITY_ICON = { 주차: 'fa-parking', 와이파이: 'fa-wifi', 조식: 'fa-utensils' };

      async function load() {
        try {
          render(await api('GET', API_URL));
        } catch (error) {
          const notice = document.getElementById('notice');
          notice.textContent = error.message; // 예) 준비 중인 숙소입니다.
          notice.classList.remove('d-none');
        }
        document.getElementById('loading').classList.add('d-none');
      }

      function render(property) { // ★ 바꿀 곳: 내 API 응답에 맞게
        document.getElementById('propertyName').textContent = property.propertyName;

        // 소개 문구는 리치텍스트 HTML 로 저장되지만, 그대로 넣으면 스크립트가 실행될 수 있어 1차는 esc() 후 줄바꿈만 살립니다(HTML 서식은 2차).
        document.getElementById('description').innerHTML = esc(property.description).replace(/\n/g, '<br>');

        if (property.images.length) {
          const hero = document.getElementById('hero');
          const photo = new Image();
          photo.alt = '';
          photo.onload = () => { // 사진을 못 불러오면 옅은 파랑 면 그대로 둡니다
            hero.prepend(photo);
            hero.classList.add('guest-hero-photo');
          };
          photo.src = property.images[0];
        }

        if (property.images.length >= 2) {
          const gallery = document.getElementById('gallery');
          gallery.innerHTML = property.images.map((path, i) =>
            `<div class="col-6 col-md-4 mb-3">
               <img src="${esc(path)}" class="guest-photo"
                    alt="${esc(property.propertyName)} 사진 ${i + 1}">
             </div>`).join('');
          document.getElementById('galleryBox').classList.remove('d-none');
        }

        if (property.facilities.length) {
          document.getElementById('facilities').innerHTML = property.facilities.map(name =>
            `<li class="guest-chip"><i class="fas ${FACILITY_ICON[name] || 'fa-check'} mr-2" aria-hidden="true"></i>${esc(name)}</li>`).join('');
          document.getElementById('facilitiesBox').classList.remove('d-none');
        }

        document.getElementById('property').classList.remove('d-none');
      }

      // 검색 카드: 오늘 이전 날짜는 고를 수 없게, 체크아웃은 체크인 다음 날부터
      const nextDay = date => {
        const next = new Date(date + 'T00:00:00Z');
        if (isNaN(next)) return ''; // 날짜를 지웠을 때
        next.setUTCDate(next.getUTCDate() + 1);
        return next.toISOString().slice(0, 10);
      };
      const checkIn = document.getElementById('widgetCheckIn');
      const checkOut = document.getElementById('widgetCheckOut');
      const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      checkIn.min = checkIn.value = today;
      checkOut.min = checkOut.value = nextDay(today);
      checkIn.addEventListener('change', () => {
        checkOut.min = nextDay(checkIn.value) || nextDay(today);
        if (checkOut.value && checkOut.value < checkOut.min) checkOut.value = checkOut.min;
      });

      load();
    </script>
</section>
</body>
</html>
