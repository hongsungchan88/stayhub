<!DOCTYPE html>
<!--/*
  로그인 화면 SCR-ACC-01 (/login). 로그인 없이 열립니다. 레이아웃(상단바·메뉴) 없이 단독 화면입니다.

  이 화면이 하는 일
    POST /api/auth/login → 성공하면 /admin 으로 이동.
    실패·잠금 메시지는 서버가 보낸 문장을 폼 위에 그대로 보여줍니다.
    /login?expired 로 들어오면(세션 만료·로그인 안 하고 /admin 접근) 안내 문구를 보여줍니다.

  따라 만들 때 바꿀 곳
    없습니다. 회원가입(SCR-ACC-02)·비밀번호 찾기(SCR-ACC-03)처럼 로그인 전 화면을 만들 때 모양만 참고하세요.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 - stayhub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
    <link rel="stylesheet" th:href="@{/css/stayhub.css}">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
    <script th:src="@{/js/stayhub.js}"></script>
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo"><b>stayhub</b></div>
    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">관리자 로그인</p>

            <div class="alert alert-info" th:if="${param.expired != null}">세션이 만료되어 다시 로그인해 주세요.</div>

            <form id="loginForm" novalidate>
                <div class="alert alert-danger d-none" data-form-error></div>
                <div class="form-group">
                    <label for="loginId" class="required">아이디</label>
                    <input type="text" class="form-control" id="loginId" name="loginId" autocomplete="username" autofocus>
                </div>
                <div class="form-group">
                    <label for="password" class="required">비밀번호</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">로그인</button>
            </form>
        </div>
    </div>
</div>

<script>
  const loginForm = document.getElementById('loginForm');
  loginForm.addEventListener('submit', async e => {
    e.preventDefault();
    clearFormError(loginForm);
    try {
      await api('POST', '/api/auth/login', formToJson(loginForm));
      location.href = '/admin';
    } catch (error) {
      showFormError(loginForm, error);
    }
  });
</script>
</body>
</html>
