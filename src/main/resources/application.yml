stayhub:
  # 업로드한 사진을 저장할 폴더(저장소 밖). 다른 곳에 두려면 application-local.yml 에 같은 키로 적으세요.
  upload-dir: ${user.home}/stayhub-uploads

server:
  tomcat:
    # 10MB 를 넘는 업로드도 이 크기까지는 끝까지 받은 뒤 400 안내를 보냅니다.
    # 기본값(2MB)이면 톰캣이 연결을 먼저 끊어 안내 문구가 화면에 도착하지 않습니다.
    max-swallow-size: 50MB
  servlet:
    session:
      # 30분 동안 요청이 없으면 세션이 끝나 다시 로그인해야 합니다. (정책정의서 "세션 만료")
      timeout: 30m
      cookie:
        # 자바스크립트에서 세션 쿠키를 읽지 못하게 합니다(XSS 로 세션을 훔치는 것 방지).
        http-only: true
        # 다른 사이트에서 보낸 POST 에는 쿠키를 붙이지 않습니다(CSRF 완화). 링크 클릭 이동은 허용.
        same-site: lax

spring:
  # 실행할 프로파일. local 이면 application-local.yml 을 함께 읽습니다.
  profiles:
    active: local

  servlet:
    multipart:
      # 사진 업로드 크기 제한. 넘으면 GlobalExceptionHandler 가 400 으로 응답합니다.
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      # 엔티티 클래스를 보고 테이블을 자동으로 만들고 바꿉니다. (개발용. 운영에서는 쓰지 않습니다)
      ddl-auto: update
    # 실행되는 SQL 을 콘솔에 찍어줍니다. 쿼리가 어떻게 나가는지 눈으로 확인할 수 있습니다.
    show-sql: true
    properties:
      hibernate:
        # 콘솔에 찍히는 SQL 을 여러 줄로 정렬해 읽기 좋게 만듭니다.
        format_sql: true
    # 화면을 그리는 동안 DB 연결을 붙잡고 있지 않도록 끕니다. 커넥션 고갈을 막아줍니다.
    open-in-view: false
    # 테이블을 먼저 만든 뒤에 data.sql을 실행합니다.(없으면 테이블이 없어서 INSERT가 실패합니다.)
    defer-datasource-initialization: true

  #서버가 켜질 때마다 data.sql을 실행합니다.(INSERT IGNORE라서 중복 걱정 없음)
  sql:
    init:
      mode: always
