name: test

on:
  # 브랜치 보호의 필수 검사로 쓰므로 paths 조건을 걸지 않습니다. 걸면 건너뛴 PR 이 "대기 중"에 멈춰 머지할 수 없습니다.
  pull_request:

permissions:
  contents: read

# 같은 PR 에 새로 push 하면 이전 실행은 취소합니다.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: gradle-test # 브랜치 보호 규칙에서 고르는 이름. 바꾸면 규칙도 함께 바꿔야 합니다.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          # 실행이 끝나면 사라지는 컨테이너라 비밀번호를 두지 않습니다. (파일·Secrets 어디에도 비밀번호 없음)
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TZ: Asia/Seoul
      # application-local.yml 대신 환경변수로 접속 정보를 넘깁니다.
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/stayhub?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 데이터베이스 만들기 (README 와 같은 문자셋)
        run: mysql -h 127.0.0.1 -u root -e "CREATE DATABASE stayhub DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: 테스트
        run: ./gradlew test

      - name: 테스트 리포트 보관 (개수·실패 원인)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
